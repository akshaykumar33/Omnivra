name: Changesets & Versioning

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Version or Publish Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Changeset Versioning Step
        run: echo "changeset version step"
