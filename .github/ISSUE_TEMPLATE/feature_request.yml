name: 💡 Feature Proposal
description: Propose a new multimodal input modality, host adapter, or plugin
labels: ["kind/feature", "status/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / User Need
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Interaction Model
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architectural Impact & Required Capabilities
