name: Release browser extension

# Push a tag like `extension-v0.1.0` to build, test, package and upload the
# extension to the Chrome Web Store. The tag's version is written into the
# manifest, so it must be higher than the version already in the store.
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit for review after uploading"
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    defaults:
      run:
        working-directory: apps/browser-extension
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile --filter @omnivra/browser-extension...
        working-directory: .

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/extension-v')
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          node -e "const f='src/manifest.json',fs=require('fs'),m=JSON.parse(fs.readFileSync(f));m.version='$version';fs.writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Browser tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Package
        run: |
          cd dist && zip -r ../omnivra-extension.zip . -x 'icons/icon.svg'

      - uses: actions/upload-artifact@v4
        with:
          name: omnivra-extension
          path: apps/browser-extension/omnivra-extension.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/extension-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          cp omnivra-extension.zip "omnivra-extension-$version.zip"
          gh release create "$GITHUB_REF_NAME" "omnivra-extension-$version.zip" \n            --title "Omnivra extension $version" \n            --notes "Install: download the zip, unzip it, open chrome://extensions (or edge://extensions), turn on Developer mode, click Load unpacked and pick the unzipped folder. See apps/browser-extension/README.md."

      - name: Upload to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        env:
          AUTO_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
        run: |
          args="--source omnivra-extension.zip --extension-id $CWS_EXTENSION_ID \
            --client-id $CWS_CLIENT_ID --client-secret $CWS_CLIENT_SECRET \
            --refresh-token $CWS_REFRESH_TOKEN"
          if [ "$AUTO_PUBLISH" = "true" ]; then
            npx --yes chrome-webstore-upload-cli@3 $args
          else
            npx --yes chrome-webstore-upload-cli@3 upload $args
          fi
